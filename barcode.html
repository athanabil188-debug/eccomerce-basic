<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barcode Alfamart</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
  </head>
  <body class="bg-white min-h-screen flex flex-col items-center justify-center text-center px-4">
    <div class="bg-gray-200 rounded-xl p-6 shadow-lg w-full max-w-md">
      <div class="bg-blue-600 rounded-lg p-6">
        <img
          src="/img aas/alfamart.jpg"
          alt="Logo Alfamart"
          class="w-32 mx-auto mb-4"
        />
        <div class="bg-gray-300 rounded-lg p-4">
          <img
            src="https://barcode.tec-it.com/barcode.ashx?data=2000009604030&code=EAN13"
            alt="Barcode"
            class="mx-auto mb-2"
          />
          <p class="text-black text-lg font-semibold tracking-wider">
            2000 0096 0403 0
          </p>
        </div>
      </div>
      <p class="text-black mt-4">Tunjukkan barcode ini ke kasir Alfamart.</p>
      <button
        onclick="history.back()"
        class="mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg transition duration-300"
      >
        Kembali
      </button>
    </div>
  </body>
</html>
